<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Double Wings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #5BAE6A; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
// ================================================================
//  DOUBLE WINGS — a doubles game
// ================================================================
const W = 864, H = 646, TOTAL = 20;
const FONT = '"Baloo 2", "Trebuchet MS", sans-serif';
const INK = '#2E2A5A';
const C = {
  ink: 0x2E2A5A, cream: 0xFFF8EC, spot: 0xFFF6E0, teal: 0x3CC8A6, pink: 0xF25F7A,
  gold: 0xFFD23F, lav: 0xB18CFF, leaf: 0x4E9A55
};
const PALETTES = [
  { wing: 0xFF9F43, edge: 0x3B2F5C, inner: 0xFFD08A },
  { wing: 0x5EC8F2, edge: 0x22406B, inner: 0xBDEBFF },
  { wing: 0xFF7EB6, edge: 0x5A2A55, inner: 0xFFC6DE },
  { wing: 0x8FD45A, edge: 0x2F5A2E, inner: 0xD8F6B8 },
  { wing: 0xB18CFF, edge: 0x3B2F6B, inner: 0xDCCBFF }
];
const RAINBOW = { wing: 0xFFD23F, edge: 0x3B2F5C, inner: 0xFF8FB8, rainbow: true };
const MODES = {
  easy:   { name: 'Easy',   color: C.teal, window: 6, fast: 3,   ex: '7 + 7 = ?',   desc: 'Single digit doubles.\nCount both wings!' },
  medium: { name: 'Medium', color: 0xFFB547, window: 7, fast: 3.5, ex: '40 + 40 = ?', desc: 'Doubles of tens.\nEach tall bar is 10.' },
  hard:   { name: 'Hard',   color: C.pink, window: 8, fast: 4,   ex: '? + ? = 16',  desc: 'Mixed doubles, and\nfind the hidden double.' }
};

// ---------- Storage ----------
const Store = {
  get(k, d) { try { const v = localStorage.getItem('dwings_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dwings_' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- Audio ----------
const Sfx = {
  ctx: null, master: null, muted: Store.get('muted', false),
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC(); this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5; this.master.connect(this.ctx.destination);
  },
  setMuted(m) { this.muted = m; Store.set('muted', m); if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  tone(freq, dur, type = 'sine', vol = 0.2, when = 0, slideTo = null) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, when = 0, freq = 1200) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when, len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  hover() { this.tone(900, 0.04, 'sine', 0.05); },
  click() { this.tone(640, 0.07, 'triangle', 0.15); },
  flutter() { for (let i = 0; i < 4; i++) this.noise(0.05, 0.05, i * 0.07, 2600); },
  spots(n) { for (let i = 0; i < Math.min(n, 5); i++) { this.tone(880 + i * 120, 0.08, 'sine', 0.06, i * 0.04); this.tone(880 + i * 120, 0.08, 'sine', 0.04, i * 0.04 + 0.02); } },
  pair(i) { const f = 440 * Math.pow(2, i / 12); this.tone(f, 0.12, 'triangle', 0.12); this.tone(f * 1.5, 0.12, 'triangle', 0.08, 0.05); },
  correct(streak) {
    const base = 523.25 * Math.pow(2, Math.min(streak - 1, 12) / 12);
    [0, 4, 7, 12].forEach((s, i) => this.tone(base * Math.pow(2, s / 12), 0.22, 'triangle', 0.15, i * 0.055));
  },
  fast() { for (let i = 0; i < 5; i++) this.tone(1800 + i * 260, 0.08, 'sine', 0.05, 0.2 + i * 0.035); },
  wrong() { this.tone(210, 0.3, 'triangle', 0.24, 0, 120); this.tone(196, 0.32, 'sine', 0.13, 0.06, 105); },
  land() { this.tone(1300, 0.12, 'sine', 0.07, 0, 900); },
  jarStep(l) { this.tone(600 + l * 110, 0.14, 'sine', 0.11); this.tone(1200 + l * 220, 0.1, 'sine', 0.04, 0.04); },
  rainbowReady() { [0, 4, 7, 11, 14].forEach((s, i) => this.tone(659 * Math.pow(2, s / 12), 0.3, 'sine', 0.11, i * 0.07)); },
  rainbow() {
    this.tone(220, 0.8, 'sawtooth', 0.05, 0, 880);
    [0, 4, 7, 12, 16, 19].forEach((s, i) => this.tone(523 * Math.pow(2, s / 12), 0.5, 'triangle', 0.12, 0.1 + i * 0.06));
    this.noise(0.5, 0.07, 0, 3000);
  },
  rainbowEnd() { this.tone(880, 0.4, 'sine', 0.08, 0, 330); },
  streak() { [0, 7, 12].forEach((s, i) => this.tone(784 * Math.pow(2, s / 12), 0.16, 'square', 0.045, i * 0.05)); },
  tick() { this.tone(880, 0.08, 'square', 0.05); },
  go() { this.tone(1320, 0.3, 'triangle', 0.15); this.tone(660, 0.3, 'triangle', 0.11); },
  start() { [0, 7, 12].forEach((s, i) => this.tone(440 * Math.pow(2, s / 12), 0.2, 'triangle', 0.14, i * 0.08)); },
  whoosh() { this.noise(0.3, 0.06, 0, 1300); },
  star(i) { const f = 784 * Math.pow(2, (i * 4) / 12); this.tone(f, 0.45, 'triangle', 0.16); this.tone(f * 2, 0.3, 'sine', 0.05, 0.05); },
  fanfare() { const n = [0, 4, 7, 12, 7, 12, 16]; n.forEach((s, i) => this.tone(523 * Math.pow(2, s / 12), i === n.length - 1 ? 0.8 : 0.18, 'triangle', 0.13, i * 0.12)); },
  record() { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => this.tone(659 * Math.pow(2, s / 12), 0.2, 'square', 0.045, i * 0.05)); this.noise(0.4, 0.05, 0, 4000); }
};

// ---------- Helpers ----------
const rnd = (a, b) => Phaser.Math.Between(a, b);
const range = n => [...Array(n).keys()];
const fmt = n => Math.round(n).toLocaleString('en-US');
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function txt(scene, x, y, str, size, color, extra = {}) {
  return scene.add.text(x, y, str, Object.assign({ fontFamily: FONT, fontSize: size + 'px', fontStyle: '800', color }, extra));
}
function starPts(r1, r2) {
  const p = [];
  for (let i = 0; i < 10; i++) { const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / 5; p.push({ x: Math.cos(a) * r, y: Math.sin(a) * r }); }
  return p;
}
function vGrad(g, x, y, w, h, c1, c2, bands = 40) {
  const a = Phaser.Display.Color.IntegerToColor(c1), b = Phaser.Display.Color.IntegerToColor(c2);
  for (let i = 0; i < bands; i++) {
    const c = Phaser.Display.Color.Interpolate.ColorWithColor(a, b, bands - 1, i);
    g.fillStyle(Phaser.Display.Color.GetColor(c.r, c.g, c.b), 1);
    g.fillRect(x, y + Math.floor(i * h / bands), w, Math.ceil(h / bands) + 1);
  }
}
function makeButton(scene, x, y, w, h, label, opt = {}) {
  const fill = opt.fill ?? C.gold, size = opt.size ?? 28, radius = opt.radius ?? Math.min(18, h / 2);
  const c = scene.add.container(x, y);
  const shadow = scene.add.graphics(), bg = scene.add.graphics();
  const draw = (col) => {
    shadow.clear(); shadow.fillStyle(0x2E2A5A, 0.25); shadow.fillRoundedRect(-w / 2, -h / 2 + 6, w, h, radius);
    bg.clear(); bg.fillStyle(col, 1); bg.fillRoundedRect(-w / 2, -h / 2, w, h, radius);
    bg.fillStyle(0xFFFFFF, 0.3); bg.fillRoundedRect(-w / 2 + 6, -h / 2 + 5, w - 12, Math.max(6, h * 0.24), Math.min(radius * 0.6, h * 0.12));
  };
  draw(fill);
  const t = txt(scene, 0, -2, label, size, opt.textColor ?? INK).setOrigin(0.5);
  c.add([shadow, bg, t]);
  c.setSize(w, h);
  c.setInteractive({ useHandCursor: true });
  c.on('pointerover', () => { scene.tweens.add({ targets: c, scale: 1.05, duration: 120, ease: 'Quad.out' }); if (!opt.quiet) Sfx.hover(); });
  c.on('pointerout', () => scene.tweens.add({ targets: c, scale: 1, duration: 150, ease: 'Quad.out' }));
  c.on('pointerdown', () => {
    Sfx.init();
    scene.tweens.add({ targets: c, scale: 0.92, duration: 70, yoyo: true, ease: 'Quad.out' });
    if (!opt.silent) Sfx.click();
    opt.onClick && opt.onClick(c);
  });
  c.redraw = draw; c.label = t;
  return c;
}
function addMuteToggle(scene, x, y) {
  const b = makeButton(scene, x, y, 120, 36, Sfx.muted ? 'Sound off' : 'Sound on', {
    fill: C.ink, textColor: '#FFF8EC', size: 17,
    onClick: () => { Sfx.setMuted(!Sfx.muted); b.label.setText(Sfx.muted ? 'Sound off' : 'Sound on'); }
  });
  return b.setDepth(40);
}

// ---------- Garden scenery ----------
function drawFlower(g, x, y, petal, s = 1) {
  g.lineStyle(4 * s, C.leaf, 1); g.lineBetween(x, y, x, y + 34 * s);
  g.fillStyle(C.leaf, 1); g.fillEllipse(x + 8 * s, y + 22 * s, 14 * s, 7 * s);
  g.fillStyle(petal, 1);
  for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; g.fillCircle(x + Math.cos(a) * 9 * s, y + Math.sin(a) * 9 * s, 7 * s); }
  g.fillStyle(0xFFD23F, 1); g.fillCircle(x, y, 6 * s);
}
function drawGarden(scene) {
  const g = scene.add.graphics().setDepth(0);
  vGrad(g, 0, 0, W, 300, 0xD9CCF7, 0xFFF0E2, 30);
  g.fillStyle(0xFFFFFF, 0.5); g.fillCircle(720, 70, 44); g.fillStyle(0xFFF4C2, 1); g.fillCircle(720, 70, 30);
  g.fillStyle(0xB9E0A0, 1); g.beginPath(); g.moveTo(0, 300);
  for (let x = 0; x <= W; x += 12) g.lineTo(x, 252 + Math.sin(x / 120 + 1) * 16 + Math.sin(x / 47) * 5);
  g.lineTo(W, 300); g.closePath(); g.fillPath();
  vGrad(g, 0, 296, W, H - 296, 0x9BD88B, 0x5BAE6A, 40);
  // hedge of tiny flowers on the hill
  const cols = [0xFF8FB8, 0xFFFFFF, 0xFFD23F, 0xB18CFF, 0x7CC6FF];
  for (let i = 0; i < 40; i++) { const x = rnd(0, W), y = rnd(262, 300); g.fillStyle(cols[i % 5], 1); g.fillCircle(x, y, rnd(3, 5)); }
  g.fillStyle(0x4E9A55, 1);
  for (let i = 0; i < 70; i++) { const x = rnd(0, W), y = rnd(320, 640); g.fillTriangle(x - 4, y, x + 4, y, x + rnd(-3, 3), y - rnd(8, 14)); }
  for (let i = 0; i < 3; i++) {
    const cl = scene.add.container(rnd(0, W), rnd(40, 170)).setDepth(0).setAlpha(0.85);
    [[0, 0, 24], [22, -10, 20], [42, 2, 18], [-20, 4, 16]].forEach(([x, y, r]) => cl.add(scene.add.circle(x, y, r, 0xFFFFFF)));
    const drift = () => scene.tweens.add({ targets: cl, x: W + 120, duration: (W + 120 - cl.x) * 95, onComplete: () => { cl.x = -120; drift(); } });
    drift();
  }
}
function makeFx(scene) {
  scene.burst = scene.add.particles(0, 0, 'spark', {
    speed: { min: 150, max: 380 }, angle: { min: 0, max: 360 }, scale: { start: 1.1, end: 0 }, alpha: { start: 1, end: 0 },
    lifespan: { min: 450, max: 850 }, gravityY: 260, tint: [C.gold, C.cream, C.pink, C.teal, C.lav], emitting: false
  }).setDepth(50);
  scene.dust = scene.add.particles(0, 0, 'spark', {
    speed: { min: 30, max: 110 }, scale: { start: 0.7, end: 0 }, alpha: { start: 0.9, end: 0 },
    lifespan: 600, tint: [0xFFFFFF, C.gold, 0xFF8FB8], emitting: false
  }).setDepth(48);
}

// ---------- Butterfly ----------
function drawWing(g, pal) {
  g.clear();
  g.fillStyle(pal.edge, 1); g.fillEllipse(-105, -45, 192, 152); g.fillEllipse(-74, 58, 142, 120);
  g.fillStyle(pal.wing, 1); g.fillEllipse(-103, -45, 176, 136); g.fillEllipse(-73, 57, 126, 104);
  if (pal.rainbow) {
    [0xFF6B8B, 0xFFB547, 0x8FD45A, 0x5EC8F2, 0xB18CFF].forEach((c, i) => { g.fillStyle(c, 0.55); g.fillEllipse(-103 + i * 4, -45 + i * 3, 160 - i * 30, 120 - i * 22); });
  } else {
    g.fillStyle(pal.inner, 0.5); g.fillEllipse(-95, -40, 116, 84); g.fillEllipse(-70, 55, 84, 66);
  }
  g.lineStyle(2, pal.edge, 0.3);
  g.lineBetween(-8, -6, -176, -86); g.lineBetween(-8, -2, -184, -14); g.lineBetween(-8, 10, -62, 104); g.lineBetween(-8, 6, -124, 72);
  g.fillStyle(0xFFFFFF, 0.95);
  for (let a = 150; a <= 245; a += 13) { const r = a * Math.PI / 180; g.fillCircle(-105 + Math.cos(r) * 89, -45 + Math.sin(r) * 69, 3); }
  for (let a = 120; a <= 210; a += 18) { const r = a * Math.PI / 180; g.fillCircle(-74 + Math.cos(r) * 64, 58 + Math.sin(r) * 53, 2.6); }
}
function makeButterfly(scene, pal) {
  const c = scene.add.container(0, 0);
  const wl = scene.add.container(0, 0), wr = scene.add.container(0, 0);
  const gl = scene.add.graphics(), gr = scene.add.graphics();
  drawWing(gl, pal); drawWing(gr, pal);
  wl.add(gl); wr.add(gr); wr.scaleX = -1;
  wl.spots = scene.add.container(0, 0); wr.spots = scene.add.container(0, 0);
  wl.add(wl.spots); wr.add(wr.spots);
  const b = scene.add.graphics();
  b.fillStyle(C.ink, 1); b.fillEllipse(0, 12, 24, 142); b.fillCircle(0, -66, 14);
  b.lineStyle(3, C.ink, 1);
  b.lineBetween(-5, -76, -14, -98); b.lineBetween(-14, -98, -26, -110);
  b.lineBetween(5, -76, 14, -98); b.lineBetween(14, -98, 26, -110);
  b.fillCircle(-27, -111, 5); b.fillCircle(27, -111, 5);
  b.fillStyle(0xFFFFFF, 1); b.fillCircle(-5, -69, 3.6); b.fillCircle(5, -69, 3.6);
  b.lineStyle(2, 0xFFFFFF, 0.8); b.beginPath(); b.arc(0, -63, 5, 0.3, Math.PI - 0.3, false); b.strokePath();
  b.lineStyle(2, 0x4B467E, 1); for (let k = 0; k < 5; k++) b.lineBetween(-10, -30 + k * 18, 10, -30 + k * 18);
  c.add([wl, wr, b]);
  c.wl = wl; c.wr = wr; c.gl = gl; c.gr = gr; c.pal = pal;
  c.repaint = p => { c.pal = p; drawWing(gl, p); drawWing(gr, p); };
  return c;
}
function idleFlap(scene, bf) {
  scene.tweens.killTweensOf([bf.wl, bf.wr]);
  bf.wl.scaleX = 1; bf.wr.scaleX = -1;
  scene.tweens.add({ targets: bf.wl, scaleX: 0.86, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
  scene.tweens.add({ targets: bf.wr, scaleX: -0.86, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
}
function fastFlap(scene, bf, repeat = 5, dur = 90) {
  scene.tweens.killTweensOf([bf.wl, bf.wr]);
  bf.wl.scaleX = 1; bf.wr.scaleX = -1;
  scene.tweens.add({ targets: bf.wl, scaleX: 0.25, duration: dur, yoyo: true, repeat });
  scene.tweens.add({ targets: bf.wr, scaleX: -0.25, duration: dur, yoyo: true, repeat });
}
// Spot slots inside one wing (mirrored automatically on the right wing)
const BIG_SLOTS = [[-150, -66], [-110, -78], [-70, -64], [-135, -24], [-95, -30], [-98, 42], [-60, 42], [-98, 82], [-60, 82]];
function wingItems(scene, tens, ones, big) {
  const objs = [];
  if (big) {
    // ones as big spots, filling the upper wing first
    for (let i = 0; i < ones; i++) {
      const [x, y] = BIG_SLOTS[i], g = scene.add.graphics();
      g.fillStyle(0x2E2A5A, 0.35); g.fillCircle(x + 2, y + 3, 15);
      g.fillStyle(C.spot, 1); g.fillCircle(x, y, 15);
      g.fillStyle(0xFFFFFF, 0.8); g.fillCircle(x - 5, y - 5, 4.5);
      objs.push(g);
    }
    return objs;
  }
  // tens as bars of ten in the upper wing, ones as small spots in the lower wing
  const g = scene.add.graphics();
  const left = -40 - (tens - 1) * 15;
  for (let i = 0; i < tens; i++) {
    const x = left + i * 15 - 5;
    g.fillStyle(0x2E2A5A, 0.35); g.fillRoundedRect(x + 2, -82, 11, 74, 3);
    g.fillStyle(C.spot, 1); g.fillRoundedRect(x, -84, 11, 72, 3);
    g.lineStyle(1, 0x8A7FB8, 0.9); for (let k = 1; k < 10; k++) g.lineBetween(x, -84 + k * 7.2, x + 11, -84 + k * 7.2);
  }
  for (let i = 0; i < ones; i++) {
    const x = -100 + (i % 3) * 22, y = 36 + Math.floor(i / 3) * 22;
    g.fillStyle(0x2E2A5A, 0.35); g.fillCircle(x + 1.5, y + 2, 9);
    g.fillStyle(C.spot, 1); g.fillCircle(x, y, 9);
  }
  objs.push(g);
  return objs;
}
function setWings(scene, bf, tens, ones, big, animate = true) {
  [bf.wl, bf.wr].forEach(w => {
    w.spots.removeAll(true);
    const items = wingItems(scene, tens, ones, big);
    w.spots.add(items);
    if (animate) { w.spots.setAlpha(0).setScale(0.6); scene.tweens.add({ targets: w.spots, alpha: 1, scale: 1, duration: 320, ease: 'Back.out' }); }
    else w.spots.setAlpha(1).setScale(1);
  });
}
function wingLabel(scene, bf, str, color = INK) {
  [bf.wl, bf.wr].forEach((w, i) => {
    const c = scene.add.container(-150, 50);
    const g = scene.add.graphics(); g.fillStyle(0xFFFFFF, 1); g.fillCircle(0, 0, 30); g.lineStyle(4, C.ink, 1); g.strokeCircle(0, 0, 30);
    const t = txt(scene, 0, -2, str, str.length > 2 ? 22 : 30, color).setOrigin(0.5);
    c.add([g, t]); if (i === 1) c.scaleX = -1;
    w.add(c); c.setScale(0); scene.tweens.add({ targets: c, scaleX: i === 1 ? -1 : 1, scaleY: 1, duration: 300, ease: 'Back.out', delay: i * 120 });
  });
}
function showPanel(scene, { title, body, color, build, onDone }) {
  const o = scene.add.container(W / 2, H / 2).setDepth(100).setAlpha(0).setScale(0.9);
  const dim = scene.add.rectangle(0, 0, W * 1.2, H * 1.2, 0x2E2A5A, 0.6).setInteractive();
  const p = scene.add.graphics();
  p.fillStyle(0x2E2A5A, 0.3); p.fillRoundedRect(-300, -223, 600, 460, 28);
  p.fillStyle(C.cream, 1); p.fillRoundedRect(-300, -230, 600, 460, 28);
  p.lineStyle(5, color, 1); p.strokeRoundedRect(-300, -230, 600, 460, 28);
  o.add([dim, p, txt(scene, 0, -196, title, 36, INK).setOrigin(0.5)]);
  if (build) build(o);
  o.add(txt(scene, 0, -26, body, 20, '#4A4570', { fontStyle: '600', align: 'center', wordWrap: { width: 520 }, lineSpacing: 2 }).setOrigin(0.5, 0));
  const btn = makeButton(scene, 0, 190, 200, 56, 'Got it', { fill: color, size: 28, onClick: () => {
    btn.disableInteractive();
    scene.tweens.add({ targets: o, alpha: 0, scale: 0.92, duration: 260, ease: 'Cubic.in', onComplete: () => { o.destroy(true); onDone(); } });
  } });
  o.add(btn);
  scene.tweens.add({ targets: o, alpha: 1, scale: 1, duration: 360, ease: 'Back.out' });
}

// ================================================================
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  create() {
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xFFFFFF, 1);
    g.fillPoints([{ x: 8, y: 0 }, { x: 10, y: 6 }, { x: 16, y: 8 }, { x: 10, y: 10 }, { x: 8, y: 16 }, { x: 6, y: 10 }, { x: 0, y: 8 }, { x: 6, y: 6 }], true);
    g.generateTexture('spark', 16, 16); g.destroy();

    });

  // ---------- Build ----------
  buildHUD() {

  }
  buildJar() {
    const x = 58, top = 120, h = 200;
    this.jarX = x; this.jarTop = top; this.jarH = h;
    this.jarHalo = this.add.circle(x, top + h / 2, 72, 0xFF8FB8, 0).setDepth(18);

    this.jarG = this.add.graphics().setDepth(21);
    this.jarLabel = txt(this, x, top + h + 10, 'Nectar jar', 15, INK, { fontStyle: '700', align: 'center', stroke: '#FFF8EC', strokeThickness: 4 }).setOrigin(0.5, 0).setDepth(20);
    this.jarTap = txt(this, x, top - 38, 'Tap me!', 19, '#B03A73', { stroke: '#FFF8EC', strokeThickness: 5 }).setOrigin(0.5).setAlpha(0).setDepth(22);

    this.updateJar();
  }
  segY(i) { return this.jarTop + this.jarH - 10 - (i + 1) * 32 - i * 4 + 16; }
  buildFlowers() {
    const g = this.add.graphics().setDepth(8);
    const cols = [0xFF8FB8, 0xFFFFFF, 0xFFD23F, 0xB18CFF, 0x7CC6FF];
    this.flowers = range(10).map(i => {
      const x = 330 + i * 54, y = 590;
      drawFlower(g, x, y, cols[i % 5], 1);
      return { x, y };
    });
    this.gardenText = txt(this, 575, 628, '', 15, '#FFF8EC', { fontStyle: '700' }).setOrigin(0.5).setDepth(20);
  }
  buildChoices() {
    this.choiceBtns = range(4).map(i => {
      const b = makeButton(this, 432 + (i - 1.5) * 188, 494, 172, 82, '', { fill: C.cream, size: 40, quiet: true, silent: true, onClick: () => this.answer(i) });
      return b.setDepth(20).setAlpha(0);
    });
  }
  showChoices(labels) {
    this.choiceBtns.forEach((b, i) => {
      this.tweens.killTweensOf(b);
      b.label.setText(labels[i]); b.redraw(C.cream);
      b.setScale(0.85).setAlpha(0.2);
      this.tweens.add({ targets: b, alpha: 1, scale: 1, duration: 260, delay: i * 40, ease: 'Back.out' });
    });
  }

  // ---------- Equation ----------
  setEquation(parts) {
    this.tweens.killTweensOf(this.eq);
    this.eq.removeAll(true);
    this.eqSlots = [];
    const objs = parts.map(p => {
      if (p === '?') {
        const s = this.add.container(0, 0), g = this.add.graphics();
        g.fillStyle(0xFFFFFF, 1); g.fillRoundedRect(-44, -32, 88, 64, 14);
        g.lineStyle(4, C.pink, 1); g.strokeRoundedRect(-44, -32, 88, 64, 14);
        const t = txt(this, 0, -2, '?', 46, '#C2335A').setOrigin(0.5);
        s.add([g, t]); s.w = 96; s.g = g; s.t = t; this.eqSlots.push(s);
        return s;
      }
      const t = txt(this, 0, 0, p, 52, INK, { stroke: '#FFF8EC', strokeThickness: 8 }).setOrigin(0.5);
      t.w = t.width + (p === '+' || p === '=' ? 18 : 6); return t;
    });
    const total = objs.reduce((a, o) => a + o.w, 0);
    let x = -total / 2;
    objs.forEach(o => { o.x = x + o.w / 2; x += o.w; this.eq.add(o); });
    this.eq.setScale(0.7).setAlpha(0);
    this.tweens.add({ targets: this.eq, scale: 1, alpha: 1, duration: 300, ease: 'Back.out' });
  }
  fillSlots(val, ok) {
    this.eqSlots.forEach((s, i) => {
      s.g.clear(); s.g.fillStyle(ok ? 0xE3F8F2 : 0xFFF3D6, 1); s.g.fillRoundedRect(-44, -32, 88, 64, 14);
      s.g.lineStyle(4, ok ? C.teal : C.gold, 1); s.g.strokeRoundedRect(-44, -32, 88, 64, 14);
      s.t.setText(String(val)).setColor(INK).setScale(0.4).setFontSize(String(val).length > 2 ? 38 : 46);
      this.tweens.add({ targets: s.t, scale: 1, duration: 300, delay: i * 120, ease: 'Back.out' });
    });
  }

  // ---------- Meters ----------
  updateJar() {
    const g = this.jarG, active = this.rainLeft > 0, n = active ? this.rainLeft : this.jar, ready = !active && this.jar >= 5;
    g.clear();
    const rb = [0xFF6B8B, 0xFFB547, 0xFFD23F, 0x8FD45A, 0x5EC8F2];
    for (let i = 0; i < 5; i++) {
      const y = this.segY(i) - 16, filled = i < n;
      g.fillStyle(filled ? (active ? rb[i] : 0xFF8FB8) : 0xFFFFFF, filled ? 1 : 0.35);
      g.fillRoundedRect(this.jarX - 22, y, 44, 32, 10);
      if (filled) { g.fillStyle(0xFFFFFF, 0.35); g.fillRoundedRect(this.jarX - 16, y + 4, 32, 8, 4); }
    }
    this.tweens.killTweensOf([this.jarHalo, this.jarTap]);
    if (ready) {
      this.jarTap.setAlpha(1).setY(this.jarTop - 38);
      this.tweens.add({ targets: this.jarHalo, alpha: { from: 0.15, to: 0.5 }, duration: 500, yoyo: true, repeat: -1 });
      this.tweens.add({ targets: this.jarTap, y: this.jarTop - 46, duration: 400, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    } else { this.jarTap.setAlpha(0); this.jarHalo.setAlpha(active ? 0.3 : 0); }
    this.jarLabel.setText(active ? 'Double\npoints!' : 'Nectar jar');
  }
  updateStreak() {
    const parts = [];
    if (this.streak > 0) parts.push(`Streak ${this.streak}  x${this.streakMult()}`);
    if (this.rainLeft > 0) parts.push('Rainbow x2');
    this.streakText.setText(parts.join('   '));
  }
  animateScore() {
    if (this.scoreTween) this.scoreTween.stop();
    this.scoreTween = this.tweens.add({ targets: this.scoreObj, v: this.score, duration: 600, ease: 'Cubic.out', onUpdate: () => this.scoreText.setText(fmt(this.scoreObj.v)) });
    this.time.delayedCall(250, () => this.tweens.add({ targets: this.scoreText, scale: 1.15, duration: 110, yoyo: true }));
  }
  drawSpeed(pts, idle) {
    const g = this.speedG, w = 340, x = 432 - w / 2, y = 388, pct = pts / 100;
    g.clear();
    g.fillStyle(0x2E2A5A, 0.2); g.fillRoundedRect(x, y - 8, w, 16, 8);
    const c = Phaser.Display.Color.Interpolate.ColorWithColor(this.colPink, this.colGold, 100, pct * 100);
    g.fillStyle(Phaser.Display.Color.GetColor(c.r, c.g, c.b), idle ? 0.35 : 1);
    g.fillRoundedRect(x, y - 8, Math.max(16, w * pct), 16, 8);
    this.speedLabel.setText(idle ? '' : '+' + pts);
  }
  floatText(x, y, str, color, size = 34, hold = 500) {
    const t = txt(this, x, y, str, size, color, { stroke: '#FFF8EC', strokeThickness: 7, align: 'center' }).setOrigin(0.5).setDepth(60).setScale(0.4).setAlpha(0);
    this.tweens.add({ targets: t, scale: 1, alpha: 1, duration: 220, ease: 'Back.out' });
    this.tweens.add({ targets: t, y: y - 50, alpha: 0, duration: 650, delay: hold, ease: 'Quad.in', onComplete: () => t.destroy() });
  }
  // Strategy card on the right side of the butterfly
  showTip(lines, hold = 2200) {
    if (this.tip) this.tip.destroy(true);
    const c = this.add.container(762, 250).setDepth(30).setAlpha(0).setScale(0.85);
    const h = 30 + lines.length * 34;
    const g = this.add.graphics();
    g.fillStyle(0x2E2A5A, 0.25); g.fillRoundedRect(-92, -h / 2 + 5, 184, h, 16);
    g.fillStyle(0xFFFFFF, 0.97); g.fillRoundedRect(-92, -h / 2, 184, h, 16);
    g.lineStyle(3, C.gold, 1); g.strokeRoundedRect(-92, -h / 2, 184, h, 16);
    c.add(g);
    lines.forEach((l, i) => c.add(txt(this, 0, -h / 2 + 32 + i * 34, l.t, l.size || 22, l.color || INK).setOrigin(0.5)));
    this.tip = c;
    this.tweens.add({ targets: c, alpha: 1, scale: 1, duration: 280, ease: 'Back.out' });
    this.tweens.add({ targets: c, alpha: 0, duration: 300, delay: hold, onComplete: () => { if (this.tip === c) this.tip = null; c.destroy(true); } });
  }

  showTutorial(done) {
    const content = {
      easy: { body: 'Both wings always match. That makes a double! How many spots in all? Tap the answer, or press keys 1 to 4.', a: [0, 3, true], eq: '3 + 3 = 6' },
      medium: { body: 'Doubles of tens! Each tall bar is 10. 4 tens and 4 tens make 8 tens, so 40 + 40 = 80.', a: [4, 0, false], eq: '40 + 40 = 80' },
      hard: { body: 'A mix of doubles. Sometimes you see the total and find the double: ? + ? = 16. Both numbers are the same!', a: [0, 8, true], eq: '8 + 8 = 16' }
    }[this.mode];
    const body = content.body + '\n\nQuick right answers fill the nectar jar. Fill it for Rainbow Wings: double points!';
    showPanel(this, { title: 'How to play', body, color: this.cfg.color, onDone: done, build: o => {
      const bf = makeButterfly(this, PALETTES[1]); bf.setPosition(-110, -114).setScale(0.36);
      setWings(this, bf, content.a[0], content.a[1], content.a[2], false); o.add(bf);
      o.add(txt(this, 90, -114, content.eq, 34, INK).setOrigin(0.5));
    } });
  }

  countdown() {
    ['3', '2', '1', 'Go!'].forEach((s, i) => this.time.delayedCall(i * 650, () => {
      const t = txt(this, 432, 250, s, 110, INK, { stroke: '#FFF8EC', strokeThickness: 12 }).setOrigin(0.5).setDepth(90).setScale(2).setAlpha(0);
      this.tweens.add({ targets: t, scale: 1, alpha: 1, duration: 260, ease: 'Back.out' });
      this.tweens.add({ targets: t, scale: 0.6, alpha: 0, duration: 240, delay: 400, ease: 'Quad.in', onComplete: () => t.destroy() });
      i < 3 ? Sfx.tick() : Sfx.go();
    }));
    this.time.delayedCall(2600, () => { this.started = true; this.nextQuestion(); });
  }

  // ---------- Questions ----------
  smallN() {
    if (!this.bag.length) this.bag = shuffle(range(8).map(i => i + 2).concat([1]));
    let n = this.bag.pop();
    if (n === this.prev && this.bag.length) { const m = this.bag.pop(); this.bag.unshift(n); n = m; }
    return n;
  }
  bigN() {
    if (!this.tensBag || !this.tensBag.length) this.tensBag = shuffle(range(9).map(i => (i + 1) * 10));
    let n = this.tensBag.pop();
    if (n === this.prev && this.tensBag.length) { const m = this.tensBag.pop(); this.tensBag.unshift(n); n = m; }
    return n;
  }
  makeQuestion() {
    const q = this.q, r = Math.random();
    if (this.mode === 'easy') return { kind: 'double', n: this.smallN() };
    if (this.mode === 'medium') return { kind: 'double', n: this.bigN() };
    if (q <= 5) return r < 0.6 ? { kind: 'double', n: this.smallN() } : { kind: 'find', n: this.smallN() };
    if (r < 0.25) return { kind: 'double', n: this.smallN() };
    if (r < 0.55) return { kind: 'double', n: this.bigN() };
    if (r < 0.75) return { kind: 'find', n: this.smallN() };
    return { kind: 'find', n: this.bigN() };
  }
  genChoices(Q) {
    const n = Q.n, S = 2 * n, A = Q.kind === 'find' ? n : S, t = Math.floor(n / 10), o = n % 10;
    const pool = [];
    const add = v => { if (v > 0 && v !== A && !pool.includes(v)) pool.push(v); };
    if (Q.kind === 'double' && n < 10) { [S - 2, S + 2, S - 1, S + 1, n, S + 3].forEach(add); }
    else if (Q.kind === 'double') {
      [S - 10, S + 10, 2 * t, S * 10, S + 20, S - 20].forEach(add);
    } else if (n < 10) { [n - 1, n + 1, S, n + 2, n - 2, n + 3, n + 4].forEach(add); }
    else { [n - 10, n + 10, S, t, n + 20, n - 20].forEach(add); }
    const pri = shuffle(pool.slice(0, 3)), rest = shuffle(pool.slice(3)), picks = [];
    for (const v of [...pri.slice(0, 2), ...rest, ...pri.slice(2)]) { if (picks.length >= 3) break; picks.push(v); }
    return [A, ...picks].sort((a, b) => a - b);
  }

  nextQuestion() {
    if (this.over) return;
    if (this.q >= TOTAL) { this.finishRound(); return; }
    this.q++;
    this.qText.setText(`Question ${this.q} of ${TOTAL}`);
    const dot = this.dots[this.q - 1];
    dot.setFillStyle(C.gold, 1);
    this.tweens.add({ targets: dot, scale: 1.5, duration: 400, yoyo: true, repeat: -1, ease: 'Sine.inOut' });

    const Q = this.makeQuestion(); this.Q = Q; this.prev = Q.n;
    Q.big = Q.n < 10;
    this.answerVal = Q.kind === 'find' ? Q.n : 2 * Q.n;
    this.choices = this.genChoices(Q);
    if (Q.kind === 'find') this.setEquation(['?', '+', '?', '=', String(2 * Q.n)]);
    else this.setEquation([String(Q.n), '+', String(Q.n), '=', '?']);

    // butterfly flutters in
    const pal = this.rainLeft > 0 ? RAINBOW : PALETTES[this.palIdx++ % PALETTES.length];
    const bf = makeButterfly(this, pal); bf.setPosition(-220, this.BY + 60).setScale(0.55).setDepth(10).setAngle(20);
    this.bf = bf;
    fastFlap(this, bf, 8, 70); Sfx.flutter();
    const o = { t: 0 };
    this.tweens.add({ targets: o, t: 1, duration: 620, ease: 'Cubic.out',
      onUpdate: () => { bf.x = -220 + (this.BX + 220) * o.t; bf.y = this.BY + 60 * (1 - o.t) - Math.sin(o.t * Math.PI * 2) * 22; },
      onComplete: () => {
        if (this.over) return;
        idleFlap(this, bf);
        this.tweens.add({ targets: bf, angle: 0, scale: 1, duration: 260, ease: 'Back.out' });
        if (Q.kind === 'find') wingLabel(this, bf, '?', '#C2335A');
        else { setWings(this, bf, Math.floor(Q.n / 10), Q.big ? Q.n : Q.n % 10, Q.big); Sfx.spots(Q.big ? Q.n : 3); }
        this.prompt.setText(Q.kind === 'find' ? 'Find the double that makes this total.' : 'How many in all?');
        this.tweens.add({ targets: this.prompt, alpha: 0.9, duration: 250 });
        this.showChoices(this.choices.map(String));
        this.time.delayedCall(320, () => { if (this.over) return; this.accepting = true; this.qStart = this.time.now; });
      } });
    this.tweens.add({ targets: bf, angle: 0, duration: 620 });
  }

  windowSec() { const base = this.mode === 'hard' && this.Q && this.Q.n < 10 ? 6.5 : this.cfg.window; return base - (this.q - 1) * 0.08; }
  speedPoints(t) { const w = this.windowSec(); if (t <= 1.2) return 100; return Math.max(10, Math.round(100 - 90 * (t - 1.2) / (w - 1.2))); }
  streakMult() { const s = this.streak; return s >= 10 ? 2.5 : s >= 6 ? 2 : s >= 3 ? 1.5 : 1; }

  answer(i) {
    if (!this.accepting || this.over) return;
    this.accepting = false;
    const t = (this.time.now - this.qStart) / 1000, btn = this.choiceBtns[i];
    const dot = this.dots[this.q - 1]; this.tweens.killTweensOf(dot); dot.setScale(1);
    this.tweens.add({ targets: this.prompt, alpha: 0, duration: 200 });
    if (this.choices[i] === this.answerVal) this.onCorrect(t, btn); else this.onWrong(t, btn);
  }
  revealWings() {
    const Q = this.Q;
    if (Q.kind === 'find') {
      [this.bf.wl, this.bf.wr].forEach(w => w.list.filter(o => o.type === 'Container' && o !== w.spots).forEach(o => o.destroy(true)));
      setWings(this, this.bf, Math.floor(Q.n / 10), Q.big ? Q.n : Q.n % 10, Q.big);
      Sfx.spots(Q.big ? Q.n : 3);
    }
  }
  onCorrect(t, btn) {
    this.correct++; this.streak++; this.bestStreak = Math.max(this.bestStreak, this.streak);
    this.times.push(t); if (this.fastest === null || t < this.fastest) this.fastest = t;
    this.dots[this.q - 1].setFillStyle(C.teal, 1);
    const gm = this.rainLeft > 0 ? 2 : 1, mult = this.streakMult() * gm, lightning = t < 1.8;
    const bonus = this.Q.n >= 10 ? 1.25 : 1;
    const pts = Math.round(this.speedPoints(t) * mult * bonus) + (lightning ? 25 * gm : 0);
    this.score += pts; this.animateScore();
    Sfx.correct(this.streak); if (lightning) Sfx.fast();
    btn.redraw(C.teal);
    this.tweens.add({ targets: btn, scale: 1.14, duration: 120, yoyo: true, ease: 'Quad.out' });
    this.burst.explode(18, btn.x, btn.y);
    this.floatText(btn.x, 432, '+' + pts, INK, 34);
    if (lightning) { this.floatText(432, 158, 'Lightning fast!', '#1E9E80', 24); this.cameras.main.flash(130, 255, 250, 240); }
    if ([3, 6, 10].includes(this.streak)) {
      Sfx.streak(); this.cameras.main.shake(180, 0.005);
      this.floatText(760, 150, `Streak ${this.streak}!\nx${this.streakMult()}`, '#C2335A', 28);
    }
    this.updateStreak();
    this.fillSlots(this.answerVal, true);
    this.revealWings();
    if (this.rainLeft === 0 && t <= this.cfg.fast) this.addJar();
    this.time.delayedCall(this.Q.kind === 'find' ? 650 : 380, () => this.flyToGarden());
  }
  onWrong(t, btn) {
    this.streak = 0; this.times.push(t);
    this.dots[this.q - 1].setFillStyle(C.pink, 1);
    this.updateStreak();
    Sfx.wrong(); this.cameras.main.shake(220, 0.008);
    btn.redraw(0xFFA3B5);
    const bx = btn.x;
    this.tweens.add({ targets: btn, x: bx + 8, duration: 50, yoyo: true, repeat: 3, onComplete: () => { btn.x = bx; } });
    const cb = this.choiceBtns[this.choices.indexOf(this.answerVal)]; cb.redraw(C.teal);
    this.tweens.add({ targets: cb, scale: 1.12, duration: 260, yoyo: true, repeat: 2, ease: 'Sine.inOut' });
    if (this.rainLeft === 0 && this.jar > 0) { this.jar--; this.updateJar(); }
    this.fillSlots(this.answerVal, false);
    this.revealWings();
    // teach: label each wing, then show the strategy
    const Q = this.Q, n = Q.n, S = 2 * n, tn = Math.floor(n / 10);
    this.time.delayedCall(Q.kind === 'find' ? 380 : 120, () => { wingLabel(this, this.bf, String(n)); Sfx.pair(0); this.time.delayedCall(160, () => Sfx.pair(4)); });
    let lines;
    if (n < 10) lines = Q.kind === 'find' ? [{ t: `Half of ${S} is ${n}` }, { t: `${n} + ${n} = ${S}`, color: '#1E9E80' }] : [{ t: `Double ${n} is ${S}` }, { t: `${n} + ${n} = ${S}`, color: '#1E9E80' }];
    else if (Q.kind === 'find') lines = [{ t: `Half of ${S} is ${n}`, size: 19 }, { t: `${n} + ${n} = ${S}`, color: '#1E9E80' }];
    else lines = [{ t: `${tn} tens + ${tn} tens`, size: 19 }, { t: `= ${2 * tn} tens`, size: 19 }, { t: `${n} + ${n} = ${S}`, color: '#1E9E80' }];
    this.time.delayedCall(450, () => this.showTip(lines, 2300));
    this.time.delayedCall(2900, () => this.flyAway());
  }

  // Correct: the butterfly joins the garden
  flyToGarden() {
    const bf = this.bf; if (!bf) return;
    const k = this.garden++, f = this.flowers[k % 10], side = Math.floor(k / 10) ? 9 : -9;
    this.gardenText.setText(`${this.garden} in the garden`);
    fastFlap(this, bf, 12, 60); Sfx.flutter();
    if (this.tip) { this.tip.destroy(true); this.tip = null; }
    const sx = bf.x, sy = bf.y, tx = f.x + side, ty = f.y - 10, o = { t: 0 };
    this.tweens.add({ targets: bf, scale: 0.13, angle: side > 0 ? 12 : -12, duration: 700, ease: 'Cubic.in' });
    this.tweens.add({ targets: o, t: 1, duration: 700, ease: 'Sine.in',
      onUpdate: () => { bf.x = sx + (tx - sx) * o.t; bf.y = sy + (ty - sy) * o.t - Math.sin(o.t * Math.PI) * 80; },
      onComplete: () => {
        this.dust.explode(8, tx, ty); Sfx.land();
        idleFlap(this, bf); bf.setDepth(9); this.kept.push(bf);
      } });
    this.bf = null;
    this.time.delayedCall(560, () => this.afterAnswer());
  }
  // Wrong: the butterfly flutters off
  flyAway() {
    const bf = this.bf; if (!bf) return;
    fastFlap(this, bf, 12, 60); Sfx.flutter();
    this.tweens.add({ targets: bf, x: W + 260, y: 80, scale: 0.4, angle: 25, duration: 800, ease: 'Cubic.in', onComplete: () => bf.destroy(true) });
    this.bf = null;
    this.time.delayedCall(450, () => this.afterAnswer());
  }
  afterAnswer() {
    if (this.rainLeft > 0) {
      this.rainLeft--;
      if (this.rainLeft === 0) this.endRainbow();
      this.updateJar(); this.updateStreak();
    }
    this.choiceBtns.forEach(b => this.tweens.add({ targets: b, alpha: 0.3, duration: 200 }));
    this.nextQuestion();
  }

  // ---------- Rainbow Wings power ----------
  addJar() {
    if (this.rainLeft > 0 || this.jar >= 5) return;
    this.jar++;
    const lvl = this.jar, sy = this.segY(lvl - 1);
    const drop = this.add.circle(this.BX, this.BY - 20, 10, 0xFF8FB8).setDepth(55);
    this.tweens.add({ targets: drop, x: this.jarX, y: sy, duration: 520, ease: 'Cubic.in', onComplete: () => {
      drop.destroy(); this.dust.explode(8, this.jarX, sy); Sfx.jarStep(lvl); this.updateJar();
      if (lvl >= 5 && this.rainLeft === 0) { this.time.delayedCall(200, () => Sfx.rainbowReady()); this.floatText(this.jarX + 90, this.jarTop - 50, 'Rainbow Wings ready!', '#B03A73', 20); }
    } });
  }
  tryRainbow() {
    if (this.jar < 5 || this.rainLeft > 0 || this.over || !this.started) return;
    this.jar = 0; this.rainLeft = 5; this.rainUses++;
    Sfx.rainbow();
    this.cameras.main.flash(350, 255, 220, 240); this.cameras.main.shake(300, 0.01);
    this.tweens.add({ targets: this.warm, alpha: 0.12, duration: 500 });
    if (this.bf) { this.bf.repaint(RAINBOW); this.burst.explode(40, this.bf.x, this.bf.y); }
    const b = txt(this, 432, 260, 'Rainbow Wings!\nDouble points', 54, INK, { stroke: '#FFD23F', strokeThickness: 12, align: 'center' }).setOrigin(0.5).setDepth(95).setScale(0.3).setAlpha(0);
    this.tweens.add({ targets: b, scale: 1, alpha: 1, duration: 350, ease: 'Back.out' });
    this.tweens.add({ targets: b, alpha: 0, y: 220, duration: 400, delay: 1000, onComplete: () => b.destroy() });
    this.updateJar(); this.updateStreak();
  }
  endRainbow() {
    Sfx.rainbowEnd();
    this.tweens.add({ targets: this.warm, alpha: 0, duration: 800 });
  }

  update(time) {
    if (this.accepting) this.drawSpeed(this.speedPoints((this.time.now - this.qStart) / 1000), false);
    if (this.rainLeft > 0 && this.bf && Math.random() < 0.25) this.dust.explode(1, this.bf.x + rnd(-180, 180), this.bf.y + rnd(-90, 90));
  }

  finishRound() {
    this.over = true; this.accepting = false;
    this.drawSpeed(0, true);
    this.tweens.add({ targets: [...this.choiceBtns, this.prompt, this.eq], alpha: 0, duration: 500 });
    // the garden butterflies all take off together
    this.kept.forEach((bf, i) => this.time.delayedCall(i * 40, () => {
      fastFlap(this, bf, 20, 60);
      this.tweens.add({ targets: bf, y: bf.y - 500 - rnd(0, 100), x: bf.x + rnd(-120, 120), scale: 0.3, duration: 1400, ease: 'Sine.in' });
    }));
    if (this.kept.length) Sfx.flutter();
    const t = this.times;
    const stats = {
      mode: this.mode, score: this.score, correct: this.correct, total: TOTAL,
      avg: t.length ? t.reduce((a, b) => a + b, 0) / t.length : 0,
      bestStreak: this.bestStreak, fastest: this.fastest, rainUses: this.rainUses
    };
    this.time.delayedCall(1300, () => {
      this.cameras.main.fadeOut(450);
      this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('End', stats));
    });
  }
}

// ================================================================
class EndScene extends Phaser.Scene {
  constructor() { super('End'); }
  init(d) { this.s = d; }
  create() {
    const s = this.s, cam = this.cameras.main, cfg = MODES[s.mode];
    cam.fadeIn(500);
    drawGarden(this); makeFx(this);
    const acc = s.correct / s.total, stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;
    const prevBest = Store.get('best_' + s.mode, 0), isRecord = s.score > prevBest;
    if (isRecord) Store.set('best_' + s.mode, s.score);
    if (stars > Store.get('stars_' + s.mode, 0)) Store.set('stars_' + s.mode, stars);

    // butterflies drift up behind the results
    for (let i = 0; i < 8; i++) {
      const bf = makeButterfly(this, PALETTES[i % PALETTES.length]).setScale(0.16).setDepth(3);
      bf.setPosition(rnd(40, W - 40), H + 40 + i * 30);
      fastFlap(this, bf, -1, 90);
      this.tweens.add({ targets: bf, y: -60, x: bf.x + rnd(-120, 120), duration: rnd(3500, 5500), delay: i * 200, ease: 'Sine.inOut' });
    }

    const head = txt(this, W / 2, 70, ['', 'Nice work!', 'Double great!', 'Double perfect!'][stars], 62, INK, { stroke: '#FFF8EC', strokeThickness: 12 }).setOrigin(0.5).setScale(0).setDepth(20);
    this.tweens.add({ targets: head, scale: 1, duration: 600, ease: 'Back.out', delay: 200,
      onComplete: () => this.tweens.add({ targets: head, y: 64, duration: 1200, yoyo: true, repeat: -1, ease: 'Sine.inOut' }) });
    const sub = txt(this, W / 2, 120, `${cfg.name} level complete`, 20, '#4A4570', { fontStyle: '700', stroke: '#FFF8EC', strokeThickness: 4 }).setOrigin(0.5).setAlpha(0).setDepth(20);
    this.tweens.add({ targets: sub, alpha: 1, duration: 500, delay: 500 });
    this.time.delayedCall(450, () => { Sfx.fanfare(); cam.flash(250, 255, 245, 250); });

    for (let i = 0; i < 3; i++) {
      const x = W / 2 + (i - 1) * 96, y = 182;
      const bg = this.add.graphics().setPosition(x, y).setDepth(20);
      bg.fillStyle(0x2E2A5A, 0.18); bg.fillPoints(starPts(38, 17), true);
      if (i < stars) {
        const st = this.add.graphics().setPosition(x, y).setScale(0).setDepth(21);
        st.fillStyle(C.gold, 1); st.fillPoints(starPts(38, 17), true);
        st.fillStyle(0xFFFFFF, 0.4); st.fillPoints(starPts(20, 9).map(p => ({ x: p.x - 6, y: p.y - 6 })), true);
        this.time.delayedCall(900 + i * 420, () => {
          Sfx.star(i); this.burst.explode(26, x, y); cam.shake(120, 0.004);
          this.tweens.add({ targets: st, scale: 1, angle: 360, duration: 500, ease: 'Back.out' });
        });
      }
    }

    const pg = this.add.graphics().setDepth(20);
    pg.fillStyle(0x2E2A5A, 0.25); pg.fillRoundedRect(W / 2 - 250, 246, 500, 230, 24);
    pg.fillStyle(C.cream, 0.97); pg.fillRoundedRect(W / 2 - 250, 240, 500, 230, 24);
    pg.lineStyle(4, cfg.color, 1); pg.strokeRoundedRect(W / 2 - 250, 240, 500, 230, 24);
    const rows = [
      ['Score', fmt(s.score)],
      ['Correct', `${s.correct} of ${s.total}`],
      ['Average speed', s.avg.toFixed(1) + ' sec'],
      ['Best streak', String(s.bestStreak)],
      ['Fastest answer', s.fastest !== null ? s.fastest.toFixed(2) + ' sec' : 'None'],
      ['Rainbow Wings', String(s.rainUses)]
    ];
    rows.forEach((r, i) => {
      const y = 272 + i * 34;
      const l = txt(this, W / 2 - 220, y, r[0], 21, '#4A4570', { fontStyle: '700' }).setOrigin(0, 0.5).setAlpha(0).setDepth(21);
      const v = txt(this, W / 2 + 220, y, i === 0 ? '0' : r[1], i === 0 ? 28 : 21, INK).setOrigin(1, 0.5).setAlpha(0).setDepth(21);
      [l, v].forEach(o => { o.x -= 20; this.tweens.add({ targets: o, alpha: 1, x: o.x + 20, duration: 350, delay: 600 + i * 90, ease: 'Cubic.out' }); });
      if (i === 0) { const o = { v: 0 }; this.tweens.add({ targets: o, v: s.score, duration: 1300, delay: 700, ease: 'Cubic.out', onUpdate: () => v.setText(fmt(o.v)) }); }
    });

    if (isRecord && s.score > 0) {
      this.time.delayedCall(1000 + stars * 420, () => {
        const c = this.add.container(W / 2 + 232, 172).setDepth(60).setAngle(-12).setScale(3).setAlpha(0);
        const g = this.add.graphics(); g.fillStyle(C.pink, 1); g.fillRoundedRect(-80, -26, 160, 52, 26);
        c.add([g, txt(this, 0, -2, 'New best!', 26, '#FFFFFF').setOrigin(0.5)]);
        this.tweens.add({ targets: c, scale: 1, alpha: 1, duration: 320, ease: 'Back.out', onComplete: () => {
          Sfx.record(); cam.shake(250, 0.01); this.burst.explode(40, c.x, c.y);
          this.tweens.add({ targets: c, scale: 1.08, duration: 600, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
        } });
      });
    }

    const again = makeButton(this, W / 2 - 115, 548, 210, 62, 'Play again', { fill: C.gold, size: 28, onClick: () => this.leave('Game', { mode: s.mode }) });
    const pick = makeButton(this, W / 2 + 115, 548, 210, 62, 'Pick level', { fill: C.cream, size: 28, onClick: () => this.leave('Modes') });
    [again, pick].forEach((b, i) => { b.setAlpha(0).setDepth(30); b.y += 30; this.tweens.add({ targets: b, alpha: 1, y: 548, duration: 450, delay: 1500 + i * 100, ease: 'Back.out' }); });
    addMuteToggle(this, 790, 616);
  }
  leave(scene, data) {
    this.input.enabled = false;
    this.cameras.main.fadeOut(350);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start(scene, data));
  }
}

// ================================================================
const config = {
  type: Phaser.AUTO, parent: 'game', width: W, height: H, backgroundColor: '#9BD88B',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, TitleScene, ModesScene, GameScene, EndScene]
};
const fontsReady = document.fonts ? Promise.all([document.fonts.load('800 40px "Baloo 2"'), document.fonts.load('600 20px "Baloo 2"')]) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(() => new Phaser.Game(config));
</script>
