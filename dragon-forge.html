<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Number Forge - Evolutions</title>
    <style>
        /* ==========================================
           CSS VARIABLES & RESET
           ========================================== */
        :root {
            --bg-color: #1a1a24;
            --text-main: #f0f0f5;
            --accent-gold: #ffd700;
            --accent-orange: #ff6a00;
            --accent-red: #ff2a00;
            --accent-blue: #00ccff;
            --accent-green: #00ff66;
            --slot-bg: #111118;
            --card-bg: linear-gradient(135deg, #444, #222);
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center; /* Center the container vertically on ultra-tall screens */
        }

        #game-container {
            width: 100%;
            max-width: 500px; /* Narrower to feel better on desktop and match phone proportions */
            height: 100%;
            max-height: 900px; /* Prevents infinite vertical stretching */
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* ==========================================
           TOP BAR (COMBO & SETTINGS)
           ========================================== */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0,0,0,0.6);
            border-bottom: 2px solid #333;
            z-index: 10;
        }

        #combo-display {
            color: var(--accent-orange);
            font-size: 1.2rem;
            text-shadow: 0 0 5px var(--accent-red);
            font-weight: 900;
            transition: transform 0.2s;
        }

        /* ==========================================
           ARENA (DIAGONAL LAYOUT)
           ========================================== */
        #arena {
            flex: 1.5; /* Increased ratio to give battle more breathing room */
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* Better vertical distribution instead of absolute top/bottom */
            position: relative;
            padding: 20px 15px;
            background: radial-gradient(circle at center, #3a2a2a 0%, #1a1a24 100%);
            transition: background 1s ease-in-out;
            overflow: hidden;
        }

        .entity {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            position: relative;
            width: 100%;
        }

        /* Boss Entity (Top Right) */
        #boss-entity {
            align-items: flex-end;
        }

        #dragon-sprite {
            font-size: 100px; /* Scaled up */
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.8));
            transition: transform 0.2s, filter 0.3s;
            transform-origin: center;
            margin-bottom: 5px;
        }

        #weakness-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            padding: 8px 15px;
            text-align: right;
            box-shadow: 0 0 10px rgba(0, 204, 255, 0.3);
            backdrop-filter: blur(4px);
            margin-top: 5px;
        }
        #weakness-range { font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; } /* Scaled up */
        .entity-name { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .boss-name { color: var(--accent-gold); text-align: right; }

        /* Player Entity (Bottom Left) */
        #player-entity {
            align-items: flex-start;
        }
        .player-name { color: var(--accent-green); text-align: left; }

        #player-sprite-container {
            position: relative;
            width: 120px; /* Scaled up */
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
            transition: transform 0.1s;
        }
        
        #player-base-sprite {
            font-size: 95px; /* Scaled up */
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5));
            transform: scaleX(-1); /* Face right */
            position: relative;
            z-index: 2;
        }

        /* Attachments */
        .attachment {
            position: absolute;
            pointer-events: none;
            transition: all 0.3s;
            opacity: 0;
            transform: scale(0);
        }
        .attachment.active { opacity: 1; transform: scale(1); }
        
        #attach-head { top: -15px; left: 25px; z-index: 3; font-size: 40px; } /* Crown */
        #attach-aura { font-size: 140px; z-index: 1; filter: drop-shadow(0 0 10px var(--accent-orange)); opacity: 0; }
        #attach-aura.active { opacity: 0.5; animation: pulse 2s infinite; }
        #attach-body { bottom: 0px; left: 50px; z-index: 3; font-size: 45px; } /* Shield */
        #attach-pet { top: -20px; right: -20px; z-index: 4; font-size: 35px; animation: float 3s infinite ease-in-out; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Health Bars */
        .health-bar-bg {
            width: 120px; height: 12px; background: #222; border-radius: 6px;
            border: 2px solid #000; overflow: hidden; position: relative;
        }
        .health-bar-fill { height: 100%; transition: width 0.3s ease; }
        #dragon-health-fill { background: var(--accent-red); width: 100%; }
        #player-health-fill { background: var(--accent-green); width: 100%; }

        /* ==========================================
           FORGE AREA
           ========================================== */
        #forge-area {
            flex: 1;
            background: linear-gradient(to top, #2a1111, #1a1a24);
            border-top: 4px solid #4a2a2a;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center the forge contents */
            padding: 15px 10px;
            z-index: 10;
        }

        #slots-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .slot-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .slot-label { font-size: 0.75rem; color: #ccc; text-transform: uppercase; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; }
        
        .slot {
            width: 60px; height: 80px; background: var(--slot-bg); border: 2px dashed #666; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8); transition: all 0.2s; cursor: pointer; position: relative;
        }
        .slot.filled { border: 2px solid var(--accent-orange); background: var(--card-bg); box-shadow: 0 0 10px rgba(255, 106, 0, 0.4); }
        .slot.highlight { border-color: var(--accent-gold); background: rgba(255, 215, 0, 0.1); }
        .slot.frozen::after {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: rgba(100, 200, 255, 0.4); border: 2px solid #00ffff; border-radius: 8px;
            box-shadow: inset 0 0 10px #ffffff; pointer-events: none; z-index: 2;
        }

        #cards-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; min-height: 75px; }
        .card {
            width: 55px; height: 75px; background: var(--card-bg); border: 2px solid #666; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.1s, border-color 0.1s;
        }
        .card.selected { border-color: var(--accent-gold); transform: translateY(-5px); box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
        .card.used { opacity: 0; pointer-events: none; transform: scale(0.5); }

        #forge-btn {
            background: linear-gradient(to bottom, #ff6a00, #cc3300); border: 2px solid #ff9900; border-radius: 12px;
            color: white; font-size: 1.4rem; font-weight: 900; padding: 15px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 6px 0 #881100;
            transition: all 0.1s; margin: 0 auto; width: 85%; max-width: 320px;
        }
        #forge-btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 0 0 #881100; }
        #forge-btn:disabled { background: linear-gradient(to bottom, #555, #333); border-color: #444; color: #888; box-shadow: 0 5px 0 #111; cursor: not-allowed; }

        /* ==========================================
           SCREENS & DRAGON SELECTOR
           ========================================== */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(15, 15, 21, 0.98); z-index: 50; transition: opacity 0.3s;
            padding: 20px; text-align: center;
        }
        .hidden { opacity: 0; pointer-events: none; }

        .menu-btn {
            background: linear-gradient(to bottom, #00ccff, #0066cc); border: 2px solid #66e0ff; border-radius: 8px;
            color: white; font-size: 1.2rem; font-weight: bold; padding: 12px 25px; margin-top: 15px; cursor: pointer;
        }

        /* Character Select */
        #dragon-roster { display: flex; gap: 15px; margin: 20px 0; overflow-x: auto; padding: 10px; max-width: 100%; justify-content: center;}
        .roster-card {
            background: #222; border: 2px solid #444; border-radius: 10px; padding: 10px; width: 110px;
            cursor: pointer; transition: transform 0.2s, border-color 0.2s; opacity: 0.5; position: relative;
        }
        .roster-card.unlocked { opacity: 1; }
        .roster-card.selected { border-color: var(--accent-gold); transform: scale(1.1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
        .roster-emoji { font-size: 40px; }
        .roster-name { font-size: 0.8rem; font-weight: bold; margin: 5px 0; color: var(--accent-gold);}
        .roster-stats { font-size: 0.7rem; color: #aaa; }
        .lock-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; opacity: 0.8; }
        .roster-card.unlocked .lock-icon { display: none; }

        /* Loot Screen */
        .loot-cards-container { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        .loot-card {
            background: #222; border: 2px solid var(--accent-gold); border-radius: 10px; padding: 10px; width: 130px;
            cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .loot-card:active { transform: scale(0.95); }
        .loot-icon { font-size: 2rem; }
        .loot-title { font-size: 0.8rem; font-weight: bold; color: var(--accent-gold); }
        .loot-desc { font-size: 0.7rem; color: #ccc; }

        /* ==========================================
           EFFECTS & ANIMATIONS
           ========================================== */
        #fx-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        .shake-hard { animation: shake-hard 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(3px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-5px, 0, 0); } 40%, 60% { transform: translate3d(5px, 0, 0); } }
        @keyframes shake-hard { 10%, 90% { transform: translate3d(-6px, -6px, 0) rotate(-2deg); } 20%, 80% { transform: translate3d(8px, 6px, 0) rotate(2deg); } 30%, 50%, 70% { transform: translate3d(-12px, -4px, 0) rotate(-3deg); } 40%, 60% { transform: translate3d(12px, 4px, 0) rotate(3deg); } }
        
        .floating-text {
            position: absolute; font-weight: 900; text-transform: uppercase; pointer-events: none; z-index: 150;
            animation: floatUp 1.5s ease-out forwards; text-shadow: 0 2px 4px #000; text-align: center;
        }
        @keyframes floatUp { 0% { opacity: 0; transform: translateY(20px) scale(0.5); } 15% { opacity: 1; transform: translateY(0) scale(1.2); } 80% { opacity: 1; transform: translateY(-40px) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(0.8); } }
        
        /* Attack Bump */
        .attack-bump { animation: attack-bump 0.3s ease-in-out; }
        @keyframes attack-bump { 0% { transform: scaleX(-1) translate(0,0); } 50% { transform: scaleX(-1) translate(20px, -20px) scale(1.2); } 100% { transform: scaleX(-1) translate(0,0); } }

    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <div id="level-indicator" style="color: #aaa; font-size: 0.9rem; font-weight: bold;">STAGE 1/4</div>
        <div id="combo-display">🔥 1x</div>
    </div>

    <!-- Arena -->
    <div id="arena">
        <!-- Boss -->
        <div id="boss-entity" class="entity boss">
            <div class="health-bar-bg"><div id="dragon-health-fill" class="health-bar-fill"></div></div>
            <div class="entity-name boss-name" id="dragon-name">Bronze Dragon</div>
            <div id="dragon-sprite">🐉</div>
            <div id="weakness-panel">
                <div style="font-size: 0.6rem; color: #aaa; text-transform: uppercase;">Weakness Range</div>
                <div id="weakness-range">4,300 - 4,600</div>
            </div>
        </div>

        <!-- Player -->
        <div id="player-entity" class="entity player">
            <div class="entity-name player-name" id="player-name">Rex Hatchling</div>
            <div class="health-bar-bg"><div id="player-health-fill" class="health-bar-fill"></div></div>
            <div id="player-sprite-container">
                <div id="attach-aura" class="attachment">🔥</div>
                <div id="player-base-sprite">🦖</div>
                <div id="attach-body" class="attachment">🛡️</div>
                <div id="attach-head" class="attachment">👑</div>
                <div id="attach-pet" class="attachment">🧚</div>
            </div>
        </div>
    </div>

    <!-- Forge Area -->
    <div id="forge-area">
        <div id="slots-container"></div>
        <div id="cards-container"></div>
        <button id="forge-btn" disabled>🔨 FORGE ATTACK!</button>
    </div>

    <!-- Screens -->
    <div id="start-screen" class="screen">
        <h1 style="color: var(--accent-gold); font-size: 2.2rem; text-shadow: 0 4px 6px #000; margin-bottom: 5px;">DRAGON FORGE</h1>
        <p style="font-size: 0.9rem; margin-bottom: 10px; color: #ccc;">Select your Dragon</p>
        
        <div id="dragon-roster">
            <!-- Roster injected here -->
        </div>

        <button class="menu-btn" onclick="startGame()">ENTER THE ARENA</button>
    </div>

    <div id="loot-screen" class="screen hidden">
        <h2 style="color: var(--accent-gold); margin-bottom: 5px;">BOSS DEFEATED!</h2>
        <p style="font-size: 0.9rem; color: #ccc;">Choose an evolution for your dragon:</p>
        <div class="loot-cards-container" id="loot-container"></div>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: var(--accent-red); font-size: 3rem;">DEFEATED</h1>
        <p style="margin-bottom: 20px;">Your dragon has fallen.</p>
        <button class="menu-btn" onclick="showScreen('start')">RETURN TO ROSTER</button>
    </div>

    <div id="victory-screen" class="screen hidden">
        <h1 style="color: var(--accent-green); font-size: 2.5rem; margin-bottom: 10px;">VICTORY!</h1>
        <p id="unlock-message" style="color: var(--accent-gold); font-weight: bold; margin-bottom: 20px; font-size: 1.1rem;"></p>
        <p>You have conquered the forge.</p>
        <button class="menu-btn" onclick="showScreen('start')">PLAY AGAIN</button>
    </div>

    <canvas id="fx-canvas"></canvas>
</div>

<script>
    /* ==========================================================================
       DATA & CONFIGURATION
       ========================================================================== */
    const PLAYER_DRAGONS = [
        { id: 'rex', emoji: '🦖', name: 'Rex Hatchling', baseHp: 150, baseDmg: 40, unlockReq: null },
        { id: 'serpent', emoji: '🐉', name: 'Jade Serpent', baseHp: 100, baseDmg: 60, unlockReq: 'Beat Boss 2' },
        { id: 'turtle', emoji: '🐢', name: 'Dragon Turtle', baseHp: 250, baseDmg: 25, unlockReq: 'Beat Run' }
    ];

    const UPGRADES = [
        { id: 'crown', name: 'Golden Crown', desc: 'Wider Crit Range', icon: '👑', slot: 'attach-head', stat: 'crit' },
        { id: 'aura', name: 'Fire Aura', desc: '+20 Damage', icon: '🔥', slot: 'attach-aura', stat: 'dmg' },
        { id: 'shield', name: 'Diamond Scales', desc: '+75 Max HP', icon: '🛡️', slot: 'attach-body', stat: 'hp' },
        { id: 'fairy', name: 'Fairy Guide', desc: '+Heal 50 HP/Turn', icon: '🧚', slot: 'attach-pet', stat: 'heal' },
        { id: 'horns', name: 'Demon Horns', desc: '+25 Damage, -25 HP', icon: '👿', slot: 'attach-head', stat: 'berserk' }
    ];

    const BOSSES = [
        { name: "Bronze Drake", emoji: "🦎", hp: 150, span: 400, type: "normal", slots: [1000, 100, 10, 1], bg: "#3a2a2a" },
        { name: "Ice Wyrm", emoji: "🧊", hp: 300, span: 350, type: "ice", slots: [1000, 100, 10, 1], bg: "#1a2a4a" },
        { name: "Chaos Dragon", emoji: "🌀", hp: 450, span: 300, type: "chaos", slots: [10, 1000, 1, 100], bg: "#3a1a4a" },
        { name: "Ancient King", emoji: "🐲", hp: 800, span: 500, type: "ancient", slots: [10000, 1000, 100, 10, 1], bg: "#4a4a1a" }
    ];

    const CONFIG = {
        critMult: 2.0, weakMult: 0.5, missDamage: 30, baseCritPct: 0.15, maxCombo: 5, comboBonus: 0.2
    };

    /* ==========================================================================
       STATE MANAGEMENT
       ========================================================================== */
    let unlocks = { rex: true, serpent: false, turtle: false };
    
    // Load Unlocks safely
    try {
        const saved = localStorage.getItem('dragonForgeUnlocks');
        if (saved) unlocks = { ...unlocks, ...JSON.parse(saved) };
    } catch(e) { console.log("Storage restricted."); }

    let state = {
        selectedDragonId: 'rex',
        playerMaxHp: 0, playerHp: 0, playerDmg: 0, playerCritMod: 1.0, playerRegen: 0,
        bossIdx: 0, bossMaxHp: 0, bossHp: 0,
        target: 0, rangeMin: 0, rangeMax: 0,
        cards: [], slots: [], selectedCardId: null, combo: 0,
        attachments: {} // tracks visual upgrades
    };

    const els = {
        playerHpFill: document.getElementById('player-health-fill'),
        bossHpFill: document.getElementById('dragon-health-fill'),
        comboDisplay: document.getElementById('combo-display'),
        lvlInd: document.getElementById('level-indicator'),
        arena: document.getElementById('arena'),
        bossSprite: document.getElementById('dragon-sprite'),
        bossName: document.getElementById('dragon-name'),
        weakRange: document.getElementById('weakness-range'),
        playerSprite: document.getElementById('player-base-sprite'),
        playerName: document.getElementById('player-name'),
        playerContainer: document.getElementById('player-sprite-container'),
        slots: document.getElementById('slots-container'),
        cards: document.getElementById('cards-container'),
        forgeBtn: document.getElementById('forge-btn'),
        roster: document.getElementById('dragon-roster'),
        loot: document.getElementById('loot-container'),
        screens: {
            start: document.getElementById('start-screen'),
            loot: document.getElementById('loot-screen'),
            gameOver: document.getElementById('game-over-screen'),
            victory: document.getElementById('victory-screen')
        },
        canvas: document.getElementById('fx-canvas')
    };
    const ctx = els.canvas.getContext('2d');

    // Resize handling
    function resize() {
        els.canvas.width = document.getElementById('game-container').clientWidth;
        els.canvas.height = document.getElementById('game-container').clientHeight;
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 100);

    /* ==========================================================================
       INITIALIZATION & FLOW
       ========================================================================== */
    function initMenu() {
        els.roster.innerHTML = '';
        PLAYER_DRAGONS.forEach(d => {
            let isUnlocked = unlocks[d.id];
            let card = document.createElement('div');
            card.className = `roster-card ${isUnlocked ? 'unlocked' : ''} ${state.selectedDragonId === d.id ? 'selected' : ''}`;
            card.innerHTML = `
                <div class="roster-emoji">${d.emoji}</div>
                <div class="roster-name">${d.name}</div>
                <div class="roster-stats">HP: ${d.baseHp} | ATK: ${d.baseDmg}</div>
                ${!isUnlocked ? `<div class="lock-icon">🔒</div><div style="font-size:0.6rem; color:#f55; margin-top:5px;">${d.unlockReq}</div>` : ''}
            `;
            if (isUnlocked) {
                card.onclick = () => {
                    state.selectedDragonId = d.id;
                    initMenu(); // re-render selection
                };
            }
            els.roster.appendChild(card);
        });
    }

    function startGame() {
        const dData = PLAYER_DRAGONS.find(d => d.id === state.selectedDragonId);
        state.playerMaxHp = dData.baseHp;
        state.playerHp = dData.baseHp;
        state.playerDmg = dData.baseDmg;
        state.playerCritMod = 1.0;
        state.playerRegen = 0;
        state.bossIdx = 0;
        state.combo = 0;
        state.attachments = {};

        // Reset visuals
        els.playerSprite.innerText = dData.emoji;
        els.playerName.innerText = dData.name;
        document.querySelectorAll('.attachment').forEach(el => {
            el.classList.remove('active');
            el.innerText = '';
        });

        showScreen(null);
        loadBoss();
    }

    function loadBoss() {
        if (state.bossIdx >= BOSSES.length) {
            handleVictory();
            return;
        }
        const boss = BOSSES[state.bossIdx];
        state.bossMaxHp = boss.hp;
        state.bossHp = boss.hp;
        
        els.bossName.innerText = boss.name;
        els.bossSprite.innerText = boss.emoji;
        els.lvlInd.innerText = `STAGE ${state.bossIdx + 1}/${BOSSES.length}`;
        els.arena.style.background = `radial-gradient(circle at center, ${boss.bg} 0%, #1a1a24 100%)`;
        
        updateHp();
        generateTurn();
    }

    function generateTurn() {
        const boss = BOSSES[state.bossIdx];
        
        // Heal regen if active
        if (state.playerRegen > 0 && state.playerHp > 0) {
            state.playerHp = Math.min(state.playerMaxHp, state.playerHp + state.playerRegen);
            spawnFloatingText(`+${state.playerRegen}`, els.playerContainer.getBoundingClientRect().left + 50, els.playerContainer.getBoundingClientRect().top, '#00ff66');
            updateHp();
        }

        let maxVal = Math.pow(10, boss.slots.length) - 1;
        let minVal = Math.pow(10, boss.slots.length - 1);
        state.target = Math.floor(Math.random() * (maxVal - minVal + 1)) + minVal;
        
        let digits = String(state.target).split('').map(Number);
        digits.sort(() => Math.random() - 0.5);
        
        state.cards = digits.map((val, i) => ({ id: i, val: val, used: false }));
        state.slots = boss.slots.map(pv => ({ pv: pv, cardId: null, frozen: false }));
        
        // Boss Mechanics
        if (boss.type === "ice") {
            let numFreeze = state.bossHp < state.bossMaxHp * 0.5 ? 2 : 1;
            let indices = Array.from(Array(boss.slots.length).keys()).sort(() => Math.random() - 0.5);
            for(let i=0; i<numFreeze; i++) state.slots[indices[i]].frozen = true;
        }

        state.selectedCardId = null;

        let halfSpan = boss.span / 2;
        let offset = Math.floor((Math.random() - 0.5) * halfSpan * 0.5); 
        state.rangeMin = Math.round((state.target - halfSpan + offset) / 10) * 10;
        state.rangeMax = Math.round((state.target + halfSpan + offset) / 10) * 10;
        
        els.weakRange.innerText = `${state.rangeMin.toLocaleString()} - ${state.rangeMax.toLocaleString()}`;

        renderUI();
    }

    /* ==========================================================================
       UI RENDERING
       ========================================================================== */
    const pvLabels = { 10000: '10K', 1000: '1000s', 100: '100s', 10: '10s', 1: '1s' };

    function renderUI() {
        const boss = BOSSES[state.bossIdx];
        
        // Slots
        els.slots.innerHTML = '';
        state.slots.forEach((slot, idx) => {
            const wrap = document.createElement('div');
            wrap.className = 'slot-wrapper';
            
            const label = document.createElement('div');
            label.className = 'slot-label';
            label.innerText = pvLabels[slot.pv];
            if (boss.type === 'chaos') label.style.color = '#ffaa00';

            const el = document.createElement('div');
            el.className = `slot ${slot.frozen ? 'frozen' : ''} ${state.selectedCardId !== null && slot.cardId === null && !slot.frozen ? 'highlight' : ''}`;
            
            if (slot.cardId !== null) {
                el.innerText = state.cards.find(c => c.id === slot.cardId).val;
                el.classList.add('filled');
            }

            el.onmousedown = el.ontouchstart = (e) => { e.preventDefault(); handleSlot(idx); };

            wrap.append(label, el);
            els.slots.appendChild(wrap);
        });

        // Cards
        els.cards.innerHTML = '';
        state.cards.forEach(card => {
            const el = document.createElement('div');
            el.className = `card ${card.used ? 'used' : ''} ${state.selectedCardId === card.id ? 'selected' : ''}`;
            el.innerText = card.val;
            el.onmousedown = el.ontouchstart = (e) => { e.preventDefault(); handleCard(card.id); };
            els.cards.appendChild(el);
        });

        els.forgeBtn.disabled = !state.slots.every(s => s.cardId !== null);
    }

    function handleCard(id) {
        if (state.cards.find(c => c.id === id).used) return;
        state.selectedCardId = state.selectedCardId === id ? null : id;
        playSound('tick'); renderUI();
    }

    function handleSlot(idx) {
        const slot = state.slots[idx];
        if (slot.frozen) {
            slot.frozen = false;
            playSound('shatter');
            let rect = els.slots.children[idx].getBoundingClientRect();
            spawnParticles(15, rect.left + rect.width/2, rect.top + rect.height/2, '#00ffff');
        } else if (slot.cardId === null && state.selectedCardId !== null) {
            slot.cardId = state.selectedCardId;
            state.cards.find(c => c.id === state.selectedCardId).used = true;
            state.selectedCardId = null;
            playSound('place');
        } else if (slot.cardId !== null) {
            state.cards.find(c => c.id === slot.cardId).used = false;
            slot.cardId = null;
            playSound('pop');
        }
        renderUI();
    }

    /* ==========================================================================
       COMBAT LOGIC
       ========================================================================== */
    els.forgeBtn.onclick = els.forgeBtn.ontouchstart = (e) => { e.preventDefault(); if(!els.forgeBtn.disabled) attack(); };

    function attack() {
        els.forgeBtn.disabled = true;
        let num = 0;
        state.slots.forEach(s => { num += state.cards.find(c => c.id === s.cardId).val * s.pv; });

        playSound('hammer');
        shakeScreen();
        
        // Animate Player Dragon bump
        els.playerSprite.classList.add('attack-bump');
        setTimeout(() => els.playerSprite.classList.remove('attack-bump'), 300);

        let color = state.combo > 2 ? '#00ccff' : (state.combo > 0 ? '#ffaa00' : '#888');
        
        // Projectile from Player to Boss
        const pRect = els.playerContainer.getBoundingClientRect();
        const bRect = els.bossSprite.getBoundingClientRect();
        
        createProjectile(num, color, pRect, bRect, () => resolveAttack(num));
    }

    function resolveAttack(num) {
        const span = state.rangeMax - state.rangeMin;
        const center = state.rangeMin + (span / 2);
        const dist = Math.abs(num - center);
        let dmg = 0, hit = ''; 

        let critThresh = CONFIG.baseCritPct * state.playerCritMod;

        if (num >= state.rangeMin && num <= state.rangeMax) {
            if (dist <= span * critThresh) { hit = 'critical'; dmg = state.playerDmg * CONFIG.critMult; state.combo += 2; }
            else { hit = 'strong'; dmg = state.playerDmg; state.combo += 1; }
            if(state.combo > CONFIG.maxCombo) state.combo = CONFIG.maxCombo;
        } else {
            state.combo = 0;
            let distEdge = num < state.rangeMin ? (state.rangeMin - num) : (num - state.rangeMax);
            if (distEdge <= span * 1.0) { hit = 'weak'; dmg = state.playerDmg * CONFIG.weakMult; }
            else { hit = 'miss'; dmg = 0; }
        }

        dmg = Math.floor(dmg * (1 + (state.combo * CONFIG.comboBonus)));
        updateComboUI();
        applyDmg(hit, dmg);
    }

    function applyDmg(hit, dmg) {
        const bRect = els.bossSprite.getBoundingClientRect();
        const bX = bRect.left + bRect.width/2;
        const bY = bRect.top + bRect.height/2;

        if (hit !== 'miss') {
            state.bossHp = Math.max(0, state.bossHp - dmg);
            
            let color = hit==='critical'?'#ffd700':(hit==='strong'?'#00ff66':'#aaa');
            spawnFloatingText(`${hit.toUpperCase()}!\n${dmg} DMG`, bX, bY - 40, color, hit==='critical'?1.5:1.2);
            spawnParticles(hit==='critical'?50:20, bX, bY, color);
            playSound('hit');
            if(hit==='critical') shakeScreen('hard');
        } else {
            spawnFloatingText(`MISS!`, bX, bY - 40, '#ff2a00', 1.5);
            setTimeout(() => {
                state.playerHp = Math.max(0, state.playerHp - CONFIG.missDamage);
                shakeScreen('hard'); playSound('roar');
                const pRect = els.playerContainer.getBoundingClientRect();
                spawnFloatingText(`-${CONFIG.missDamage} HP`, pRect.left + 50, pRect.top, '#ff0000', 1.5);
                updateHp();
                checkState();
            }, 500);
        }

        updateHp();
        if(hit !== 'miss') setTimeout(checkState, 1000);
    }

    function checkState() {
        if (state.playerHp <= 0) showScreen('gameOver');
        else if (state.bossHp <= 0) {
            playSound('victory');
            spawnParticles(80, els.bossSprite.getBoundingClientRect().left+40, els.bossSprite.getBoundingClientRect().top+40, '#ffd700', 5);
            state.bossIdx++;
            
            // Check Boss Unlocks
            if(state.bossIdx === 2 && !unlocks.serpent) {
                unlocks.serpent = true;
                saveUnlocks();
                spawnFloatingText("DRAGON UNLOCKED!", window.innerWidth/2, window.innerHeight/2, '#00ff66', 1.5);
            }

            setTimeout(() => {
                if(state.bossIdx < BOSSES.length) generateLoot();
                else handleVictory();
            }, 1500);
        } else generateTurn();
    }

    function handleVictory() {
        let msg = "";
        if(!unlocks.turtle) {
            unlocks.turtle = true;
            saveUnlocks();
            msg = "NEW DRAGON UNLOCKED: Dragon Turtle!";
        }
        document.getElementById('unlock-message').innerText = msg;
        showScreen('victory');
    }

    function saveUnlocks() {
        try { localStorage.setItem('dragonForgeUnlocks', JSON.stringify(unlocks)); } catch(e){}
    }

    /* ==========================================================================
       LOOT & UPGRADES
       ========================================================================== */
    function generateLoot() {
        let avail = UPGRADES.filter(u => !state.attachments[u.id]).sort(() => 0.5 - Math.random()).slice(0, 3);
        els.loot.innerHTML = '';
        avail.forEach(u => {
            let card = document.createElement('div');
            card.className = 'loot-card';
            card.innerHTML = `<div class="loot-icon">${u.icon}</div><div class="loot-title">${u.name}</div><div class="loot-desc">${u.desc}</div>`;
            card.onclick = () => {
                playSound('powerup');
                
                // Apply visual
                state.attachments[u.id] = true;
                const slotEl = document.getElementById(u.slot);
                if(slotEl) {
                    slotEl.innerText = u.icon;
                    slotEl.classList.add('active');
                }

                // Apply stats
                if(u.stat === 'crit') state.playerCritMod += 0.5;
                if(u.stat === 'dmg') state.playerDmg += 20;
                if(u.stat === 'hp') { state.playerMaxHp += 75; state.playerHp += 75; }
                if(u.stat === 'heal') state.playerRegen += 50;
                if(u.stat === 'berserk') { state.playerDmg += 25; state.playerMaxHp -= 25; state.playerHp = Math.min(state.playerHp, state.playerMaxHp); }

                updateHp();
                showScreen(null);
                loadBoss();
            };
            els.loot.appendChild(card);
        });
        showScreen('loot');
    }

    /* ==========================================================================
       HELPERS & EFFECTS
       ========================================================================== */
    function updateHp() {
        els.playerHpFill.style.width = `${(state.playerHp / state.playerMaxHp) * 100}%`;
        els.bossHpFill.style.width = `${state.bossMaxHp ? (state.bossHp / state.bossMaxHp) * 100 : 100}%`;
    }

    function updateComboUI() {
        els.comboDisplay.innerText = state.combo > 0 ? `🔥 ${(1 + (state.combo * CONFIG.comboBonus)).toFixed(1)}x DMG` : '';
    }

    function showScreen(id) {
        Object.values(els.screens).forEach(s => s.classList.add('hidden'));
        if(id) els.screens[id].classList.remove('hidden');
    }

    function shakeScreen(type='normal') {
        const c = document.getElementById('game-container');
        c.classList.remove('shake', 'shake-hard');
        void c.offsetWidth;
        c.classList.add(type === 'hard' ? 'shake-hard' : 'shake');
    }

    function spawnFloatingText(txt, x, y, color, scale=1) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = txt;
        el.style.left = `${x}px`; el.style.top = `${y}px`;
        el.style.color = color; el.style.fontSize = `${1.2 * scale}rem`;
        el.style.transform = `translate(-50%, -50%)`;
        document.getElementById('game-container').appendChild(el);
        setTimeout(() => el.remove(), 1500);
    }

    function createProjectile(num, color, startRect, endRect, cb) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = num;
        el.style.color = '#fff'; el.style.textShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
        el.style.fontSize = '2.5rem';
        
        let sX = startRect.left + startRect.width/2;
        let sY = startRect.top + startRect.height/2;
        let eX = endRect.left + endRect.width/2;
        let eY = endRect.top + endRect.height/2;

        el.style.left = `${sX}px`; el.style.top = `${sY}px`;
        el.style.transform = `translate(-50%, -50%)`;
        el.style.transition = 'all 0.4s cubic-bezier(0.5, 0, 0.8, 0.2)'; // Accelerate towards target
        
        document.getElementById('game-container').appendChild(el);
        
        // Next frame to trigger transition
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                el.style.left = `${eX}px`;
                el.style.top = `${eY}px`;
                el.style.transform = `translate(-50%, -50%) scale(0.5)`;
            });
        });

        setTimeout(() => { el.remove(); cb(); }, 400);
    }

    /* AUDIO (Synth) */
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if(actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator(), gain = actx.createGain();
        osc.connect(gain); gain.connect(actx.destination);
        const t = actx.currentTime;
        switch(type) {
            case 'tick': osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(1200, t+0.05); gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.05); osc.start(t); osc.stop(t+0.05); break;
            case 'place': osc.type='triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(150, t+0.1); gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.1); osc.start(t); osc.stop(t+0.1); break;
            case 'pop': osc.frequency.setValueAtTime(400, t); gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.1); osc.start(t); osc.stop(t+0.1); break;
            case 'hammer': osc.type='square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(50, t+0.2); gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.2); osc.start(t); osc.stop(t+0.2); break;
            case 'hit': osc.type='sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(50, t+0.3); gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.3); osc.start(t); osc.stop(t+0.3); break;
            case 'roar': osc.type='sawtooth'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(40, t+0.6); gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.6); osc.start(t); osc.stop(t+0.6); break;
            case 'shatter': osc.type='square'; osc.frequency.setValueAtTime(1000, t); osc.frequency.exponentialRampToValueAtTime(2000, t+0.1); gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.1); osc.start(t); osc.stop(t+0.1); break;
            case 'powerup': osc.frequency.setValueAtTime(440, t); osc.frequency.setValueAtTime(659, t+0.1); osc.frequency.setValueAtTime(880, t+0.2); gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.6); osc.start(t); osc.stop(t+0.6); break;
            case 'victory': osc.type='triangle'; osc.frequency.setValueAtTime(440, t); osc.frequency.setValueAtTime(554, t+0.1); osc.frequency.setValueAtTime(659, t+0.2); osc.frequency.setValueAtTime(880, t+0.3); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.8); osc.start(t); osc.stop(t+0.8); break;
        }
    }
    document.body.addEventListener('touchstart', () => {if(actx.state==='suspended') actx.resume();}, {once:true});
    document.body.addEventListener('click', () => {if(actx.state==='suspended') actx.resume();}, {once:true});

    /* PARTICLES */
    let particles = [];
    function spawnParticles(count, x, y, color, spd=2) {
        for(let i=0; i<count; i++) {
            let ang = Math.random()*Math.PI*2, s = Math.random()*spd*3+spd;
            particles.push({x:x, y:y, vx:Math.cos(ang)*s, vy:Math.sin(ang)*s, life:1, dec:Math.random()*0.02+0.02, col:color, sz:Math.random()*4+2});
        }
    }
    function updateParticles() {
        ctx.clearRect(0,0,els.canvas.width,els.canvas.height);
        for(let i=particles.length-1; i>=0; i--) {
            let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=p.dec;
            if(p.life<=0) particles.splice(i,1);
            else { ctx.globalAlpha=p.life; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,Math.PI*2); ctx.fill(); }
        }
        ctx.globalAlpha=1; requestAnimationFrame(updateParticles);
    }
    requestAnimationFrame(updateParticles);

    // Boot
    initMenu();

</script>
</body>
