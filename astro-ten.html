<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astro-Ten: Portrait Defender</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        :root {
            --primary-glow: #66fcf1;
            --accent: #45a29e;
            --bg-dark: #0b0c10;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Fredoka One', cursive;
            overflow: hidden;
            /* Critical for mobile browser bars */
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
        }

        #app-wrapper {
            width: 100%;
            max-width: 500px; /* Constrain width for a sleek portrait look */
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
        }

        #phaser-container {
            width: 100%;
            flex-grow: 1; /* Game takes available top space */
            position: relative;
        }

        #controls-ui {
            background: #1f2833;
            padding: 15px;
            border-top: 4px solid var(--accent);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .num-btn {
            aspect-ratio: 1.5 / 1;
            background: #0b0c10;
            color: var(--primary-glow);
            border: 2px solid var(--accent);
            border-radius: 12px;
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--accent);
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .num-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--accent);
            background: var(--accent);
            color: #0b0c10;
        }

        .hint-text {
            color: #c5c6c7;
            font-size: 14px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="app-wrapper">
    <div id="phaser-container"></div>
    
    <div id="controls-ui">
        <div class="hint-text">Shoot the pair that makes 10!</div>
        <div class="numpad">
            <button class="num-btn" onpointerdown="handleInput(1)">1</button>
            <button class="num-btn" onpointerdown="handleInput(2)">2</button>
            <button class="num-btn" onpointerdown="handleInput(3)">3</button>
            <button class="num-btn" onpointerdown="handleInput(4)">4</button>
            <button class="num-btn" onpointerdown="handleInput(5)">5</button>
            <button class="num-btn" onpointerdown="handleInput(6)">6</button>
            <button class="num-btn" onpointerdown="handleInput(7)">7</button>
            <button class="num-btn" onpointerdown="handleInput(8)">8</button>
            <button class="num-btn" onpointerdown="handleInput(9)">9</button>
        </div>
    </div>
</div>

<script>
/** * ADJUSTABLE PARAMETERS
 */
const GAME_SPEEDS = {
    startVelocity: 100,
    velocityStep: 20,
    spawnDelay: 2200,
    minSpawnDelay: 900
};

const COLORS = {
    primary: 0x66fcf1,
    danger: 0xff5252,
    asteroid: 0x45a29e,
    ship: 0x66fcf1
};

// Global for Numpad
let handleInput;

const config = {
    type: Phaser.AUTO,
    parent: 'phaser-container',
    width: 600,  // Native Portrait Width
    height: 900, // Native Portrait Height
    transparent: true,
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 } }
    },
    scene: { preload, create, update }
};

const game = new Phaser.Game(config);

function preload() {}

function create() {
    const scene = this;
    
    // Variables
    this.score = 0;
    this.lives = 3;
    this.level = 1;
    this.isGameOver = false;

    // Background Stars
    this.stars = [];
    for(let i=0; i<60; i++) {
        this.stars.push(this.add.circle(
            Phaser.Math.Between(0, 600), 
            Phaser.Math.Between(0, 900), 
            Phaser.Math.FloatBetween(1, 3), 
            0xffffff, 0.4
        ));
    }

    // Ship (Bottom of the viewport)
    const shipBase = this.add.graphics();
    shipBase.fillStyle(COLORS.ship, 1);
    shipBase.fillTriangle(-30, 20, 30, 20, 0, -30);
    shipBase.lineStyle(2, 0xffffff, 1);
    shipBase.strokeTriangle(-30, 20, 30, 20, 0, -30);
    this.ship = this.add.container(300, 850, [shipBase]);

    // Groups
    this.asteroids = this.physics.add.group();

    // UI
    this.scoreText = this.add.text(30, 30, 'SCORE: 0', { 
        fontFamily: 'Fredoka One', fontSize: '36px', fill: '#66fcf1' 
    });
    this.livesText = this.add.text(570, 30, '♥♥♥', { 
        fontSize: '36px', fill: '#ff5252' 
    }).setOrigin(1, 0);

    // Particles (for juice)
    this.createEmitter = (x, y) => {
        const particles = this.add.particles(0, 0, 'dot', {
            x, y,
            speed: { min: -200, max: 200 },
            scale: { start: 0.6, end: 0 },
            lifespan: 400,
            blendMode: 'ADD',
            emitting: false
        });
        
        // Generate a quick texture for the particle
        const dot = this.make.graphics({x: 0, y: 0, add: false});
        dot.fillStyle(0x66fcf1);
        dot.fillCircle(5, 5, 5);
        dot.generateTexture('dot', 10, 10);
        
        particles.explode(20);
        this.time.delayedCall(500, () => particles.destroy());
    };

    // Logic for Input
    handleInput = (val) => {
        if(this.isGameOver) return;
        this.fire(val);
    };

    // Keyboard support
    this.input.keyboard.on('keydown', (e) => {
        const n = parseInt(e.key);
        if(n >= 1 && n <= 9) handleInput(n);
    });

    // Spawning
    this.spawnTimer = this.time.addEvent({
        delay: GAME_SPEEDS.spawnDelay,
        callback: this.spawnAsteroid,
        callbackScope: this,
        loop: true
    });

    // Resize functionality
    const resize = () => {
        const container = document.getElementById('phaser-container');
        if (container) {
            document.body.style.height = `${window.innerHeight}px`;
        }
    };
    window.addEventListener('resize', resize);
    setTimeout(resize, 200);

    this.createStartScreen();
}

function update() {
    if(this.isGameOver) return;

    // Star parallax
    this.stars.forEach(s => {
        s.y += 1;
        if(s.y > 900) s.y = 0;
    });

    // Asteroid logic
    this.asteroids.getChildren().forEach(a => {
        if(a.y > 830) {
            this.hitBase();
            a.destroy();
        }
    });
}

// --- Scene Methods ---

Phaser.Scene.prototype.spawnAsteroid = function() {
    const x = Phaser.Math.Between(60, 540);
    const num = Phaser.Math.Between(1, 9);
    
    const container = this.add.container(x, -50);
    const circ = this.add.circle(0, 0, 45, 0x1f2833).setStrokeStyle(4, COLORS.asteroid);
    const txt = this.add.text(0, 0, num, { 
        fontFamily: 'Fredoka One', fontSize: '42px', fill: '#ffffff' 
    }).setOrigin(0.5);

    container.add([circ, txt]);
    container.mathValue = num;

    this.asteroids.add(container);
    this.physics.world.enable(container);
    container.body.setVelocityY(GAME_SPEEDS.startVelocity + (this.level * GAME_SPEEDS.velocityStep));
};

Phaser.Scene.prototype.fire = function(val) {
    let target = null;
    let lowestY = -100;

    this.asteroids.getChildren().forEach(a => {
        if(a.mathValue + val === 10) {
            if(a.y > lowestY) {
                lowestY = a.y;
                target = a;
            }
        }
    });

    if(target) {
        // Juice: Beam
        const beam = this.add.graphics();
        beam.lineStyle(6, 0x66fcf1, 1);
        beam.lineBetween(this.ship.x, this.ship.y - 30, target.x, target.y);
        this.tweens.add({
            targets: beam, alpha: 0, duration: 100, onComplete: () => beam.destroy()
        });

        // Juice: Explosion
        this.createEmitter(target.x, target.y);
        target.destroy();

        // Progress
        this.score += 10;
        this.scoreText.setText('SCORE: ' + this.score);
        if(this.score % 100 === 0) {
            this.level++;
            this.spawnTimer.delay = Math.max(GAME_SPEEDS.minSpawnDelay, this.spawnTimer.delay - 200);
        }
    } else {
        this.cameras.main.shake(150, 0.01);
    }
};

Phaser.Scene.prototype.hitBase = function() {
    this.lives--;
    this.livesText.setText('♥'.repeat(this.lives));
    this.cameras.main.flash(200, 255, 0, 0, 0.4);
    this.cameras.main.shake(300, 0.02);

    if(this.lives <= 0) {
        this.gameOver();
    }
};

Phaser.Scene.prototype.gameOver = function() {
    this.isGameOver = true;
    this.physics.pause();
    this.spawnTimer.remove();
    
    const overlay = this.add.rectangle(300, 450, 600, 900, 0x000000, 0.85).setDepth(100);
    this.add.text(300, 350, 'MISSION OVER', { 
        fontSize: '60px', fontFamily: 'Fredoka One', fill: COLORS.primary 
    }).setOrigin(0.5).setDepth(101);

    this.add.text(300, 450, `Final Score: ${this.score}\nGreat effort!`, { 
        fontSize: '32px', fontFamily: 'Fredoka One', fill: '#ffffff', align: 'center' 
    }).setOrigin(0.5).setDepth(101);

    const btn = this.add.text(300, 600, 'RETRY', { 
        fontSize: '40px', fontFamily: 'Fredoka One', fill: '#0b0c10', backgroundColor: '#66fcf1', padding: 20 
    }).setOrigin(0.5).setDepth(101).setInteractive().on('pointerdown', () => window.location.reload());
};

Phaser.Scene.prototype.createStartScreen = function() {
    this.physics.pause();
    const overlay = this.add.rectangle(300, 450, 600, 900, 0x0b0c10, 1).setDepth(100);
    this.add.text(300, 300, 'ASTRO-TEN', { 
        fontSize: '80px', fontFamily: 'Fredoka One', fill: COLORS.primary 
    }).setOrigin(0.5).setDepth(101);

    const btn = this.add.text(300, 500, 'LAUNCH', { 
        fontSize: '40px', fontFamily: 'Fredoka One', fill: '#0b0c10', backgroundColor: '#66fcf1', padding: 20 
    }).setOrigin(0.5).setDepth(101).setInteractive().on('pointerdown', () => {
        overlay.destroy();
        this.physics.resume();
        btn.destroy();
    });
};
</script>
</body>
</html>
